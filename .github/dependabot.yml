# Dependabot configuration file
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "nuget"
    directory: "/src/Maester.Engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps): "
    ignore:
      # Pinned to the oldest supported PowerShell: the engine compiles against it and the
      # runtime supplies the assembly, so a newer reference stops the DLL loading on 7.4.0.
      - dependency-name: "System.Management.Automation"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps): "
    ignore:
      # @docusaurus/theme-mermaid declares layout-elk ^0.1.9 as a peer, which allows
      # only 0.1.x, so 0.2.x (counted as a minor update) and 1.x break npm ci.
      # Lift once Docusaurus widens the peer range.
      - dependency-name: "@mermaid-js/layout-elk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      icons:
        patterns:
          - "@fortawesome/*"
          - "@iconify/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@docusaurus/*"
          - "@fortawesome/*"
          - "@iconify/*"
          - "react"
          - "react-dom"

  - package-ecosystem: "npm"
    directory: "/report"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps): "
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/typography"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss-animate"
        update-types: ["version-update:semver-major"]
      - dependency-name: "autoprefixer"
        update-types: ["version-update:semver-major"]
    groups:
      ui-components:
        patterns:
          - "@radix-ui/*"
          - "@headlessui/*"
          - "@tremor/*"
      icons:
        patterns:
          - "@heroicons/*"
          - "@remixicon/*"
          - "lucide-react"
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "eslint"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@radix-ui/*"
          - "@headlessui/*"
          - "@tremor/*"
          - "@heroicons/*"
          - "@remixicon/*"
          - "lucide-react"
          - "typescript"
          - "@types/*"
          - "eslint"
          - "react"
          - "react-dom"
          - "react-router-dom"
