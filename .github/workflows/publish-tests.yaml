# Updates the maester-tests repository with the latest tests
# This is still required since we use it for the GitHub action and Azure DevOPs starter guide.
name: publish-tests
permissions:
  contents: read

concurrency:
  group: publish-tests
  cancel-in-progress: false

on:
  # Runs whenever a new Maester module is published
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest release tag
        id: release_tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName)
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Could not resolve a release tag for the stamp step."
          }
          "tag=$tag" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Stamp maester-config.json version fields
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: ./build/Update-MaesterConfigVersion.ps1 -ConfigPath ./tests/maester-config.json -ModuleVersion $env:RELEASE_TAG

      - name: Generate Maester Bot token for maester-tests
        id: maester-tests-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MAESTER_BOT_APP_ID }}
          private-key: ${{ secrets.MAESTER_BOT_PRIVATE_KEY }}
          owner: maester365
          repositories: maester-tests
          permission-contents: write

      - name: Checkout maester-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maester365/maester-tests
          ref: main
          path: .publish/maester-tests
          token: ${{ steps.maester-tests-token.outputs.token }}
          # Required for the authenticated push below; checkout removes it after the job.
          persist-credentials: true
          fetch-depth: 1

      - name: Publish to maester-tests
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          target="$GITHUB_WORKSPACE/.publish/maester-tests"
          mkdir -p "$target/tests"
          rsync -a --delete "$GITHUB_WORKSPACE/tests/" "$target/tests/"

          cd "$target"
          git config user.name "maester-bot[bot]"
          git config user.email "283276319+maester-bot[bot]@users.noreply.github.com"
          git add --all tests

          if git diff --cached --quiet; then
            echo "No test changes to publish."
            exit 0
          fi

          git commit -m "See https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_SHA from $SOURCE_REF"
          git push origin HEAD:main
