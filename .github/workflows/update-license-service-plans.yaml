name: update-license-service-plans

# Keeps the licence lookup of the test builder (maester.dev/test-builder) and the module's licence names
# (powershell/assets/MaesterServicePlanNames.json) in step with Microsoft's "Product names and service plan
# identifiers for licensing" page.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'

permissions: {}

concurrency:
  group: update-license-service-plans
  cancel-in-progress: false

jobs:
  update-license-service-plans:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and parse the licensing reference
        working-directory: website
        run: node scripts/update-license-service-plans.mjs

      - name: Generate maester-bot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MAESTER_BOT_APP_ID }}
          private-key: ${{ secrets.MAESTER_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            website/src/data/license-service-plans.json
            powershell/assets/MaesterServicePlanNames.json
          commit-message: 'chore: update licence service plans'
          branch: 'automation/update-license-service-plans'
          delete-branch: true
          title: 'chore: update licence service plans'
          body: |
            Refreshes `website/src/data/license-service-plans.json` and `powershell/assets/MaesterServicePlanNames.json` from Microsoft's licensing reference:
            https://learn.microsoft.com/entra/identity/users/licensing-service-plan-reference

            The file is parsed from the page's Markdown in `MicrosoftDocs/entra-docs` by `website/scripts/update-license-service-plans.mjs`.

            Why this matters in Maester:
            - The test builder at maester.dev/test-builder uses this list to look up the service plan names for `[MaesterTest(License = ...)]`.
            - The module reads `MaesterServicePlanNames.json` to name a missing licence by its friendly name when it skips a test. A test's licence check itself matches the plan name against the tenant at run time.

            Reviewer note:
            - A diff that removes many plans at once probably means the page layout changed. The script refuses to write when it parses fewer than 100 products or plans.
